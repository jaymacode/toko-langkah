[project]
name = "tokolangkah-api"
version = "0.1.0"
description = "TokoLangkah FastAPI backend"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "openai==3.29.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pyjwt[crypto]==2.15.1",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: requires a real PostgreSQL database (run with `uv run pytest -m db`)",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.12"

[tool.uv]
package = true
