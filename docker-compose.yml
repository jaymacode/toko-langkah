# Runs TokoLangkah against the Supabase project and model endpoint configured in .env.
#
#   docker compose --profile setup run --rm setup   # once: migrations, synthetic data, demo accounts
#   docker compose up -d --build                    # API on :8000, web on :3000
services:
  setup:
    profiles: ["setup"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      APP_ENV: development
    # Root only for this one-shot job, so it can write artifacts/ on any host.
    user: "0:0"
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts
    command:
      - sh
      - -c
      - python -m tokolangkah_api.admin.migrate && python -m tokolangkah_api.admin.seed --target supabase

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_APP_MODE: ${NEXT_PUBLIC_APP_MODE:-development}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
